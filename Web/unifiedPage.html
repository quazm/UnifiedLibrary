<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Загрузка...</title>
</head>
<body>
    <div id="loader" style="text-align:center;padding:3em;color:#999;">Загрузка страницы...</div>
    <script>
        (function () {
            fetch('/Plugin/UnifiedLibrary/Page')
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function (html) {
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function (e) {
                    document.getElementById('loader').innerHTML = 'Ошибка загрузки: ' + e.message;
                });
        })();
    </script>
</body>
</html>
