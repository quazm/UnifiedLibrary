<div id="UnifiedLibraryPage" data-role="page" class="page libraryPage" style="padding-top:0 !important;">
    <div class="pageContainer">

        <div class="padded-left padded-right padded-top-page">
            <h1 class="pageTitle">Все фильмы</h1>
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:.5em;margin-top:.5em;">
                <input id="searchInput" type="search"
                       class="emby-input" placeholder="Поиск..."
                       style="max-width:18em;padding:.5em;" />
                <button id="btnFilter" class="raised button-submit" style="padding:.4em .8em;">
                    <span class="material-icons" style="vertical-align:middle;margin-right:.3em;">filter_list</span>
                    <span>Фильтры</span>
                </button>
                <button id="btnSort" class="raised button-submit" style="padding:.4em .8em;">
                    <span class="material-icons" style="vertical-align:middle;margin-right:.3em;">sort</span>
                    <span>Сортировка</span>
                </button>
                <button id="btnSortOrder" class="raised button-submit" style="padding:.4em .8em;" title="Направление сортировки">
                    <span id="sortOrderIcon" class="material-icons" style="vertical-align:middle;">arrow_upward</span>
                </button>

                <span style="display:inline-block;width:1px;height:1.8em;background:#444;margin:0 .5em;vertical-align:middle;"></span>

                <button id="prevBtnTop" class="raised button-submit" disabled style="padding:.3em .6em;">
                    <span class="material-icons" style="vertical-align:middle;font-size:1.2em;">chevron_left</span>
                </button>
                <div id="pageNumbersTop" class="ulPageNumbers"></div>
                <button id="nextBtnTop" class="raised button-submit" disabled style="padding:.3em .6em;">
                    <span class="material-icons" style="vertical-align:middle;font-size:1.2em;">chevron_right</span>
                </button>
                <div class="ulPageJump">
                    <input id="pageInputTop" type="number" min="1" class="emby-input" placeholder="Стр." style="width:4.5em;padding:.3em;text-align:center;" />
                    <button id="btnGoPageTop" class="raised button-submit" style="padding:.3em .6em;">Перейти</button>
                </div>
            </div>
        </div>

        <div id="filterMenu" class="ulFilterMenu" style="display:none;">
            <div class="ulFilterSection">
                <div class="ulFilterHeader">Жанры</div>
                <div id="genreCheckboxes" class="ulFilterList"></div>
            </div>
            <div class="ulFilterSection">
                <div class="ulFilterHeader">Годы</div>
                <div id="yearCheckboxes" class="ulFilterList"></div>
            </div>
            <div class="ulFilterSection">
                <div class="ulFilterHeader">Статус</div>
                <div id="statusRadios" class="ulFilterList"></div>
            </div>
            <div class="ulFilterActions">
                <button id="btnApply" class="raised button-submit"><span>Применить</span></button>
                <button id="btnClear" class="raised"><span>Сбросить</span></button>
            </div>
        </div>

        <div id="sortMenu" class="ulFilterMenu" style="display:none;">
            <div class="ulFilterSection">
                <div class="ulFilterHeader">Сортировка</div>
                <div id="sortRadios" class="ulFilterList"></div>
            </div>
        </div>

        <div id="itemsContainer"
             class="itemsContainer vertical-wrap padded-left padded-right padded-top-page"></div>

        <div class="padded-left padded-right padded-bottom-page flex align-items-center"
             style="justify-content:center;gap:.5em;margin-top:1em;flex-wrap:wrap;">
            <button id="prevBtn" class="raised button-submit" disabled style="padding:.3em .6em;">
                <span class="material-icons" style="vertical-align:middle;font-size:1.2em;">chevron_left</span>
            </button>
            <div id="pageNumbers" class="ulPageNumbers"></div>
            <button id="nextBtn" class="raised button-submit" disabled style="padding:.3em .6em;">
                <span class="material-icons" style="vertical-align:middle;font-size:1.2em;">chevron_right</span>
            </button>
            <div class="ulPageJump">
                <input id="pageInput" type="number" min="1" class="emby-input" placeholder="Стр." style="width:4.5em;padding:.3em;text-align:center;" />
                <button id="btnGoPage" class="raised button-submit" style="padding:.3em .6em;">Перейти</button>
            </div>
        </div>
    </div>

    <style>
        .ulFilterMenu {
            position: fixed;
            top: 5em;
            left: 1em;
            z-index: 1000;
            background: #1e1e1e;
            border-radius: .3em;
            box-shadow: 0 .5em 2em rgba(0,0,0,.6);
            padding: 1em;
            max-height: 70vh;
            overflow-y: auto;
            min-width: 16em;
            max-width: 22em;
        }

        .ulFilterSection {
            margin-bottom: 1em;
        }

        .ulFilterHeader {
            font-size: .95em;
            color: #ccc;
            margin-bottom: .4em;
            font-weight: bold;
        }

        .ulFilterList {
            max-height: 12em;
            overflow-y: auto;
        }

            .ulFilterList label {
                display: flex;
                align-items: center;
                gap: .5em;
                padding: .3em 0;
                cursor: pointer;
                font-size: .9em;
            }

            .ulFilterList input[type="checkbox"],
            .ulFilterList input[type="radio"] {
                accent-color: #00a4dc;
                margin: 0;
            }

        .ulFilterActions {
            display: flex;
            gap: .5em;
            margin-top: .5em;
        }

            .ulFilterActions button {
                flex: 1;
                padding: .5em;
            }

        .ulPageNumbers {
            display: flex;
            align-items: center;
            gap: .2em;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ulPageNum {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2em;
            height: 2em;
            padding: 0 .3em;
            border-radius: .3em;
            cursor: pointer;
            color: #ccc;
            font-size: .9em;
            background: none;
            border: none;
            transition: background .15s, color .15s;
        }

            .ulPageNum:hover {
                background: rgba(255,255,255,.1);
                color: #fff;
            }

            .ulPageNum.active {
                background: #00a4dc;
                color: #fff;
                cursor: default;
                font-weight: bold;
            }

            .ulPageNum.dots {
                cursor: default;
                color: #666;
            }

                .ulPageNum.dots:hover {
                    background: none;
                    color: #666;
                }

        .ulPageJump {
            display: flex;
            align-items: center;
            gap: .4em;
            margin-left: .8em;
        }

        .card {
            display: inline-block;
            vertical-align: top;
            margin: .4em;
        }

        .portraitCard {
            width: 10em;
        }

        .cardScalable {
            position: relative;
            overflow: hidden;
            border-radius: .3em;
            background: #1a1a1a;
        }

        .cardPadder {
            padding-bottom: 150%;
            position: relative;
        }

        .cardImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

            .cardImage img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .cardImageIcon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 3em;
            color: #555;
        }

        .cardOverlayContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity .2s;
            background: rgba(0,0,0,.15);
        }

        .card:hover .cardOverlayContainer {
            opacity: 1;
        }

        .cardOverlayButton-br {
            position: absolute;
            bottom: .3em;
            right: .3em;
        }

        .cardOverlayButton {
            background: rgba(0,0,0,.7);
            border-radius: 50%;
            width: 2.4em;
            height: 2.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            color: #fff;
            padding: 0;
            transition: background .15s, transform .15s;
        }

            .cardOverlayButton:hover {
                background: rgba(0,0,0,.95);
                transform: scale(1.15);
            }

        .cardBox {
            padding-bottom: .3em;
        }

        .cardText {
            margin-top: .3em;
            font-size: .85em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            color: #fff;
            background: none;
            border: none;
            padding: 0;
            width: 100%;
            cursor: pointer;
            display: block;
        }

        .cardText-secondary {
            color: #999;
            font-size: .8em;
            cursor: default;
        }

        .card-hoverable:hover .cardScalable {
            box-shadow: 0 .25em .8em rgba(0,0,0,.5);
            transform: scale(1.03);
            transition: transform .15s, box-shadow .15s;
        }
    </style>

    <script>
        (function () {
            'use strict';

            var itemsContainer = document.getElementById('itemsContainer');
            var searchInput = document.getElementById('searchInput');
            var btnFilter = document.getElementById('btnFilter');
            var btnSort = document.getElementById('btnSort');
            var btnSortOrder = document.getElementById('btnSortOrder');
            var sortOrderIcon = document.getElementById('sortOrderIcon');
            var filterMenu = document.getElementById('filterMenu');
            var sortMenu = document.getElementById('sortMenu');
            var genreBox = document.getElementById('genreCheckboxes');
            var yearBox = document.getElementById('yearCheckboxes');
            var statusBox = document.getElementById('statusRadios');
            var sortBox = document.getElementById('sortRadios');
            var btnApply = document.getElementById('btnApply');
            var btnClear = document.getElementById('btnClear');

            var prevBtn = document.getElementById('prevBtn');
            var nextBtn = document.getElementById('nextBtn');
            var pageNumbers = document.getElementById('pageNumbers');
            var pageInput = document.getElementById('pageInput');
            var btnGoPage = document.getElementById('btnGoPage');

            var prevBtnTop = document.getElementById('prevBtnTop');
            var nextBtnTop = document.getElementById('nextBtnTop');
            var pageNumbersTop = document.getElementById('pageNumbersTop');
            var pageInputTop = document.getElementById('pageInputTop');
            var btnGoPageTop = document.getElementById('btnGoPageTop');

            var state = {
                userId: null, serverId: null,
                startIndex: 0, limit: 100,
                sortBy: 'SortName', sortOrder: 'Ascending',
                searchTerm: '', genres: [], years: [], status: '',
                totalCount: 0
            };

            var STORAGE_KEY = 'unifiedLibraryPageState';

            function saveState() {
                try {
                    var data = {
                        startIndex: state.startIndex,
                        sortBy: state.sortBy,
                        sortOrder: state.sortOrder,
                        searchTerm: state.searchTerm,
                        genres: state.genres,
                        years: state.years,
                        status: state.status
                    };
                    sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) { }
            }

            function restoreState() {
                try {
                    var raw = sessionStorage.getItem(STORAGE_KEY);
                    if (!raw) return;
                    var data = JSON.parse(raw);
                    if (data.startIndex !== undefined) state.startIndex = data.startIndex;
                    if (data.sortBy) state.sortBy = data.sortBy;
                    if (data.sortOrder) state.sortOrder = data.sortOrder;
                    if (data.searchTerm !== undefined) state.searchTerm = data.searchTerm;
                    if (data.genres) state.genres = data.genres;
                    if (data.years) state.years = data.years;
                    if (data.status !== undefined) state.status = data.status;
                } catch (e) { }
            }

            function api() { return window.ApiClient || (window.parent && window.parent.ApiClient); }

            function loadGenres() {
                var c = api(); if (!c || !state.userId) return;
                fetch('/Genres?userId=' + state.userId + '&Recursive=true&IncludeItemTypes=Movie&SortBy=SortName&SortOrder=Ascending&Limit=200',
                    { headers: { 'X-Emby-Token': c.accessToken() } })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        var items = d.Items || [];
                        genreBox.innerHTML = '';
                        for (var i = 0; i < items.length; i++) {
                            var lbl = document.createElement('label');
                            var cb = document.createElement('input');
                            cb.type = 'checkbox'; cb.value = items[i].Name;
                            cb.checked = state.genres.indexOf(items[i].Name) !== -1;
                            var sp = document.createElement('span');
                            sp.textContent = items[i].Name;
                            lbl.appendChild(cb); lbl.appendChild(sp);
                            genreBox.appendChild(lbl);
                        }
                    }).catch(function () { });
            }

            function loadYears() {
                var c = api(); if (!c || !state.userId) return;
                fetch('/Plugin/UnifiedLibrary/Filters?userId=' + state.userId,
                    { headers: { 'X-Emby-Token': c.accessToken() } })
                    .then(function (r) { return r.json(); })
                    .then(function (d) {
                        var yrs = d.Years || [];
                        yearBox.innerHTML = '';
                        for (var i = 0; i < yrs.length; i++) {
                            var lbl = document.createElement('label');
                            var cb = document.createElement('input');
                            cb.type = 'checkbox'; cb.value = String(yrs[i]);
                            cb.checked = state.years.indexOf(yrs[i]) !== -1;
                            var sp = document.createElement('span');
                            sp.textContent = String(yrs[i]);
                            lbl.appendChild(cb); lbl.appendChild(sp);
                            yearBox.appendChild(lbl);
                        }
                    }).catch(function () { });
            }

            function buildStatusRadios() {
                var opts = [
                    { v: '', t: 'Все' },
                    { v: 'played', t: 'Просмотрено' },
                    { v: 'unplayed', t: 'Не просмотрено' },
                    { v: 'favorite', t: 'Избранное' }
                ];
                statusBox.innerHTML = '';
                for (var i = 0; i < opts.length; i++) {
                    var lbl = document.createElement('label');
                    var rb = document.createElement('input');
                    rb.type = 'radio'; rb.name = 'ulStatus'; rb.value = opts[i].v;
                    rb.checked = (state.status === opts[i].v);
                    var sp = document.createElement('span');
                    sp.textContent = opts[i].t;
                    lbl.appendChild(rb); lbl.appendChild(sp);
                    statusBox.appendChild(lbl);
                }
            }

            function buildSortRadios() {
                var opts = [
                    { v: 'SortName', t: 'Название', defaultOrder: 'Ascending' },
                    { v: 'ProductionYear', t: 'Год', defaultOrder: 'Descending' },
                    { v: 'DateCreated', t: 'Дата добавления', defaultOrder: 'Descending' },
                    { v: 'PremiereDate', t: 'Дата премьеры', defaultOrder: 'Descending' },
                    { v: 'CommunityRating', t: 'Рейтинг', defaultOrder: 'Descending' },
                    { v: 'Runtime', t: 'Длительность', defaultOrder: 'Descending' },
                    { v: 'Random', t: 'Случайно', defaultOrder: 'Ascending' }
                ];
                sortBox.innerHTML = '';
                for (var i = 0; i < opts.length; i++) {
                    var lbl = document.createElement('label');
                    var rb = document.createElement('input');
                    rb.type = 'radio'; rb.name = 'ulSort'; rb.value = opts[i].v;
                    rb.checked = (state.sortBy === opts[i].v);
                    rb.dataset.defaultOrder = opts[i].defaultOrder;
                    var sp = document.createElement('span');
                    sp.textContent = opts[i].t;
                    lbl.appendChild(rb); lbl.appendChild(sp);
                    sortBox.appendChild(lbl);

                    rb.addEventListener('change', function () {
                        if (!this.checked) return;
                        state.sortBy = this.value;
                        state.sortOrder = this.dataset.defaultOrder;
                        updateSortOrderIcon();
                        state.startIndex = 0;
                        saveState();
                        sortMenu.style.display = 'none';
                        loadItems();
                    });
                }
            }

            function updateSortOrderIcon() {
                if (state.sortOrder === 'Ascending') {
                    sortOrderIcon.textContent = 'arrow_upward';
                    btnSortOrder.title = 'По возрастанию (клик для убывания)';
                } else {
                    sortOrderIcon.textContent = 'arrow_downward';
                    btnSortOrder.title = 'По убыванию (клик для возрастания)';
                }
            }

            function applyFilters() {
                state.genres = [];
                var gc = genreBox.querySelectorAll('input:checked');
                for (var i = 0; i < gc.length; i++) state.genres.push(gc[i].value);

                state.years = [];
                var yc = yearBox.querySelectorAll('input:checked');
                for (var i = 0; i < yc.length; i++) state.years.push(parseInt(yc[i].value, 10));

                var sr = statusBox.querySelector('input:checked');
                state.status = sr ? sr.value : '';

                filterMenu.style.display = 'none';
                state.startIndex = 0;
                saveState();
                loadItems();
            }

            function clearFilters() {
                state.genres = []; state.years = []; state.status = '';
                buildStatusRadios();
                loadGenres();
                loadYears();
                state.startIndex = 0;
                saveState();
                loadItems();
            }

            /* ===== Универсальный поиск playbackManager в webpack ===== */
            var _playbackManagerCache = null;
            var _playbackManagerSearchDone = false;

            function isPlaybackManager(obj) {
                if (!obj || typeof obj !== 'object') return false;
                if (typeof obj.play !== 'function') return false;
                if (typeof obj.canPlay !== 'function') return false;

                var signatureMethods = [
                    'isPlaying', 'stop', 'pause', 'getPlaylist',
                    'isPlayingVideo', 'isPlayingAudio', 'getPlayers'
                ];

                var matchCount = 0;
                for (var i = 0; i < signatureMethods.length; i++) {
                    if (typeof obj[signatureMethods[i]] === 'function') {
                        matchCount++;
                    }
                }
                return matchCount >= 2;
            }

            function getPlaybackManager() {
                if (_playbackManagerCache) return _playbackManagerCache;
                if (_playbackManagerSearchDone) return null;

                if (window.playbackManager && typeof window.playbackManager.play === 'function') {
                    _playbackManagerCache = window.playbackManager;
                    console.log('[UnifiedLibrary] playbackManager found in window.playbackManager');
                    return _playbackManagerCache;
                }

                if (typeof webpackChunk === 'undefined' || !Array.isArray(webpackChunk)) {
                    _playbackManagerSearchDone = true;
                    return null;
                }

                var found = null;
                var uniqueId = '__ul_search_' + Date.now();

                try {
                    webpackChunk.push([
                        [uniqueId],
                        {},
                        function (require) {
                            for (var c = 0; c < webpackChunk.length && !found; c++) {
                                var chunk = webpackChunk[c];
                                if (!Array.isArray(chunk) || chunk.length < 2) continue;

                                var modules = chunk[1];
                                if (!modules || typeof modules !== 'object') continue;

                                var modIds = Object.keys(modules);
                                for (var m = 0; m < modIds.length && !found; m++) {
                                    var modId = modIds[m];
                                    if (modId === uniqueId) continue;

                                    try {
                                        var mod = require(modId);
                                        if (!mod) continue;

                                        if (isPlaybackManager(mod)) {
                                            found = mod;
                                            console.log('[UnifiedLibrary] playbackManager found at module:', modId, '(direct export)');
                                            break;
                                        }

                                        var exports = Object.keys(mod);
                                        for (var e = 0; e < exports.length; e++) {
                                            try {
                                                var exp = mod[exports[e]];
                                                if (isPlaybackManager(exp)) {
                                                    found = exp;
                                                    console.log('[UnifiedLibrary] playbackManager found at module:', modId, 'export:', exports[e]);
                                                    break;
                                                }
                                            } catch (ex) { }
                                        }
                                    } catch (err) { }
                                }
                            }
                        }
                    ]);
                } catch (e) {
                    console.warn('[UnifiedLibrary] webpack search failed:', e);
                }

                _playbackManagerSearchDone = true;
                _playbackManagerCache = found;

                if (found) {
                    console.log('[UnifiedLibrary] playbackManager extracted successfully');
                } else {
                    console.warn('[UnifiedLibrary] playbackManager not found in any webpack module');
                }

                return found;
            }

            /* ===== Воспроизведение через нативный плеер Jellyfin ===== */
            function playItem(id) {
                var c = api();
                if (!c) {
                    openDetails(id);
                    return;
                }

                var pm = getPlaybackManager();

                if (!pm || typeof pm.play !== 'function') {
                    console.warn('[UnifiedLibrary] playbackManager not available, opening details page');
                    openDetails(id);
                    return;
                }

                c.getItem(state.userId, id).then(function (item) {
                    if (!item) {
                        openDetails(id);
                        return;
                    }

                    try {
                        if (pm.canPlay(item)) {
                            pm.play({
                                items: [item],
                                serverId: item.ServerId || state.serverId,
                                startPositionTicks: item.UserData && item.UserData.PlaybackPositionTicks
                                    ? item.UserData.PlaybackPositionTicks
                                    : 0
                            });
                        } else {
                            console.warn('[UnifiedLibrary] Item cannot be played, opening details');
                            openDetails(id);
                        }
                    } catch (e) {
                        console.error('[UnifiedLibrary] play() error:', e);
                        openDetails(id);
                    }
                }).catch(function (err) {
                    console.error('[UnifiedLibrary] getItem error:', err);
                    openDetails(id);
                });
            }

            function createCard(item) {
                var card = document.createElement('div');
                card.className = 'card portraitCard card-hoverable';
                card.setAttribute('data-id', item.Id);

                var box = document.createElement('div');
                box.className = 'cardBox';

                var scalable = document.createElement('div');
                scalable.className = 'cardScalable';

                var padder = document.createElement('div');
                padder.className = 'cardPadder';
                scalable.appendChild(padder);

                var imgC = document.createElement('div');
                imgC.className = 'cardImage';
                if (item.ImageTags && item.ImageTags.Primary) {
                    var img = document.createElement('img');
                    img.src = '/Items/' + item.Id + '/Images/Primary?maxWidth=400&tag=' + encodeURIComponent(item.ImageTags.Primary);
                    img.loading = 'lazy';
                    img.alt = item.Name || '';
                    imgC.appendChild(img);
                } else {
                    var ic = document.createElement('span');
                    ic.className = 'material-icons cardImageIcon';
                    ic.textContent = 'movie';
                    imgC.appendChild(ic);
                }
                scalable.appendChild(imgC);

                var overlay = document.createElement('div');
                overlay.className = 'cardOverlayContainer';
                var obr = document.createElement('div');
                obr.className = 'cardOverlayButton-br';
                var pb = document.createElement('button');
                pb.className = 'cardOverlayButton itemAction';
                pb.title = 'Воспроизвести';
                pb.setAttribute('is', 'paper-icon-button-light');
                pb.setAttribute('data-action', 'play');
                pb.setAttribute('data-id', item.Id);
                pb.setAttribute('data-serverid', state.serverId || '');
                pb.setAttribute('data-type', item.Type || 'Movie');
                var pi = document.createElement('span');
                pi.className = 'material-icons play_arrow';
                pi.setAttribute('aria-hidden', 'true');
                pb.appendChild(pi);
                pb.addEventListener('click', function (e) {
                    e.stopPropagation();
                    e.preventDefault();
                    playItem(item.Id);
                });
                obr.appendChild(pb);
                overlay.appendChild(obr);
                scalable.appendChild(overlay);

                box.appendChild(scalable);

                var t1 = document.createElement('div');
                t1.className = 'cardText cardText-first';
                t1.textContent = item.Name || '';
                box.appendChild(t1);

                var t2 = document.createElement('div');
                t2.className = 'cardText cardText-secondary';
                t2.textContent = item.ProductionYear ? String(item.ProductionYear) : '';
                box.appendChild(t2);

                card.appendChild(box);

                (function (id) {
                    card.addEventListener('click', function (e) {
                        if (e.target.closest('.itemAction')) return;
                        openDetails(id);
                    });
                })(item.Id);

                return card;
            }

            function openDetails(id) {
                window.location.hash = '#!/details?id=' + id;
            }

            function renderItems(items) {
                itemsContainer.innerHTML = '';
                if (!items || items.length === 0) {
                    itemsContainer.innerHTML = '<div style="text-align:center;padding:3em;color:#999;">Ничего не найдено</div>';
                    return;
                }
                var frag = document.createDocumentFragment();
                for (var i = 0; i < items.length; i++) frag.appendChild(createCard(items[i]));
                itemsContainer.appendChild(frag);
            }

            function buildUrl() {
                var u = '/Plugin/UnifiedLibrary/Items';
                u += '?userId=' + state.userId;
                u += '&StartIndex=' + state.startIndex;
                u += '&Limit=' + state.limit;
                u += '&SortBy=' + encodeURIComponent(state.sortBy);
                u += '&SortOrder=' + state.sortOrder;
                u += '&Recursive=true';
                u += '&IncludeItemTypes=Movie';
                u += '&Fields=PrimaryImageAspectRatio,SortName,ProductionYear,DateCreated';
                u += '&ImageTypeLimit=1';
                u += '&EnableImageTypes=Primary';
                if (state.searchTerm) u += '&SearchTerm=' + encodeURIComponent(state.searchTerm);
                for (var i = 0; i < state.genres.length; i++) {
                    u += '&Genres=' + encodeURIComponent(state.genres[i]);
                }
                for (var i = 0; i < state.years.length; i++) {
                    u += '&Years=' + state.years[i];
                }
                if (state.status === 'played') u += '&IsPlayed=true';
                if (state.status === 'unplayed') u += '&IsUnplayed=true';
                if (state.status === 'favorite') u += '&IsFavorite=true';
                return u;
            }

            function loadItems() {
                var c = api();
                if (!c || !state.userId) return;
                itemsContainer.innerHTML = '<div style="text-align:center;padding:3em;color:#999;">Загрузка...</div>';

                fetch(buildUrl(), { headers: { 'X-Emby-Token': c.accessToken() } })
                    .then(function (r) {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function (d) {
                        state.totalCount = d.TotalRecordCount || 0;
                        renderItems(d.Items || []);
                        renderPagination();
                    })
                    .catch(function (e) {
                        itemsContainer.innerHTML = '<div style="text-align:center;padding:3em;color:#999;">Ошибка: ' + e.message + '</div>';
                    });
            }

            function getPageNumbers(current, total) {
                var pages = [];
                if (total <= 9) {
                    for (var i = 1; i <= total; i++) pages.push(i);
                    return pages;
                }
                pages.push(1);
                var start = Math.max(2, current - 2);
                var end = Math.min(total - 1, current + 2);
                if (current <= 4) { start = 2; end = 6; }
                if (current >= total - 3) { start = total - 5; end = total - 1; }
                if (start > 2) pages.push('...');
                for (var i = start; i <= end; i++) pages.push(i);
                if (end < total - 1) pages.push('...');
                pages.push(total);
                return pages;
            }

            function goToPage(pageNum) {
                var totalPages = Math.max(1, Math.ceil(state.totalCount / state.limit));
                if (pageNum < 1) pageNum = 1;
                if (pageNum > totalPages) pageNum = totalPages;
                state.startIndex = (pageNum - 1) * state.limit;
                saveState();
                loadItems();
            }

            function renderPagination() {
                var currentPage = Math.floor(state.startIndex / state.limit) + 1;
                var totalPages = Math.max(1, Math.ceil(state.totalCount / state.limit));
                var pages = getPageNumbers(currentPage, totalPages);

                var containers = [
                    { numbers: pageNumbers, prev: prevBtn, next: nextBtn, input: pageInput },
                    { numbers: pageNumbersTop, prev: prevBtnTop, next: nextBtnTop, input: pageInputTop }
                ];

                for (var c = 0; c < containers.length; c++) {
                    var ct = containers[c];
                    if (!ct.numbers) continue;

                    ct.numbers.innerHTML = '';
                    for (var i = 0; i < pages.length; i++) {
                        var p = pages[i];
                        var btn = document.createElement('button');
                        if (p === '...') {
                            btn.className = 'ulPageNum dots';
                            btn.textContent = '...';
                        } else {
                            btn.className = 'ulPageNum' + (p === currentPage ? ' active' : '');
                            btn.textContent = String(p);
                            if (p !== currentPage) {
                                (function (pageNum) {
                                    btn.addEventListener('click', function () { goToPage(pageNum); });
                                })(p);
                            }
                        }
                        ct.numbers.appendChild(btn);
                    }

                    ct.prev.disabled = state.startIndex <= 0;
                    ct.next.disabled = (state.startIndex + state.limit) >= state.totalCount;
                    if (ct.input) {
                        ct.input.max = totalPages;
                        ct.input.placeholder = '/' + totalPages;
                    }
                }
            }

            var searchTimer = null;
            searchInput.addEventListener('input', function () {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function () {
                    state.searchTerm = searchInput.value.trim();
                    state.startIndex = 0;
                    saveState();
                    loadItems();
                }, 400);
            });

            btnFilter.addEventListener('click', function (e) {
                e.stopPropagation();
                sortMenu.style.display = 'none';
                filterMenu.style.display = filterMenu.style.display === 'none' ? 'block' : 'none';
            });

            btnSort.addEventListener('click', function (e) {
                e.stopPropagation();
                filterMenu.style.display = 'none';
                sortMenu.style.display = sortMenu.style.display === 'none' ? 'block' : 'none';
            });

            btnSortOrder.addEventListener('click', function () {
                state.sortOrder = state.sortOrder === 'Ascending' ? 'Descending' : 'Ascending';
                updateSortOrderIcon();
                state.startIndex = 0;
                saveState();
                loadItems();
            });

            btnApply.addEventListener('click', applyFilters);
            btnClear.addEventListener('click', clearFilters);

            document.addEventListener('click', function (e) {
                if (!filterMenu.contains(e.target) && e.target !== btnFilter) filterMenu.style.display = 'none';
                if (!sortMenu.contains(e.target) && e.target !== btnSort) sortMenu.style.display = 'none';
            });

            prevBtn.addEventListener('click', function () {
                state.startIndex = Math.max(0, state.startIndex - state.limit);
                saveState();
                loadItems();
            });
            nextBtn.addEventListener('click', function () {
                state.startIndex += state.limit;
                saveState();
                loadItems();
            });
            btnGoPage.addEventListener('click', function () {
                var val = parseInt(pageInput.value, 10);
                if (!isNaN(val) && val > 0) { goToPage(val); pageInput.value = ''; }
            });
            pageInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    var val = parseInt(this.value, 10);
                    if (!isNaN(val) && val > 0) { goToPage(val); this.value = ''; }
                }
            });

            prevBtnTop.addEventListener('click', function () {
                state.startIndex = Math.max(0, state.startIndex - state.limit);
                saveState();
                loadItems();
            });
            nextBtnTop.addEventListener('click', function () {
                state.startIndex += state.limit;
                saveState();
                loadItems();
            });
            btnGoPageTop.addEventListener('click', function () {
                var val = parseInt(pageInputTop.value, 10);
                if (!isNaN(val) && val > 0) { goToPage(val); pageInputTop.value = ''; }
            });
            pageInputTop.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    var val = parseInt(this.value, 10);
                    if (!isNaN(val) && val > 0) { goToPage(val); this.value = ''; }
                }
            });

            function init() {
                var c = api();
                if (!c) {
                    itemsContainer.innerHTML = '<div style="text-align:center;padding:3em;color:#999;">ApiClient не найден</div>';
                    return;
                }
                state.userId = c.getCurrentUserId();
                state.serverId = c.serverId();
                if (!state.userId) {
                    itemsContainer.innerHTML = '<div style="text-align:center;padding:3em;color:#999;">Пользователь не определён</div>';
                    return;
                }

                fetch('/Plugin/UnifiedLibrary/Config')
                    .then(function (r) { return r.json(); })
                    .then(function (cfg) {
                        if (cfg.PageSize && cfg.PageSize > 0) {
                            state.limit = cfg.PageSize;
                        }
                        afterConfigLoaded();
                    })
                    .catch(function () {
                        afterConfigLoaded();
                    });
            }

            function afterConfigLoaded() {
                restoreState();
                searchInput.value = state.searchTerm;
                buildStatusRadios();
                buildSortRadios();
                updateSortOrderIcon();
                loadGenres();
                loadYears();
                loadItems();
            }

            init();
        })();
    </script>
</div>
